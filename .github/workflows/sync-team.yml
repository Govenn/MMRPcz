name: Sync Discord Team

on:
  schedule:
    - cron: '0 */6 * * *'   # automaticky každých 6 hodin
  workflow_dispatch:         # + možnost spustit ručně (záložka Actions → Run workflow)

permissions:
  contents: write

jobs:
  sync-team:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stažení dat z Discordu
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node sync-team.mjs

      - name: Commit a push změn (jen pokud se tým změnil)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add team.json
          git diff --staged --quiet || git commit -m "Automatická aktualizace týmu z Discordu"
          git push
